version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hydropulse_web
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - PORT=5000
      - HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-use-a-strong-secret-key}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/interim/hydropulse.db}
      - OPENMETEO_TIMEOUT_SECONDS=${OPENMETEO_TIMEOUT_SECONDS:-15}
      - REQUESTS_CACHE_EXPIRE_AFTER=${REQUESTS_CACHE_EXPIRE_AFTER:-21600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hydropulse_scheduler
    command: ["python", "-m", "src.hydropulse.pipeline.refresh", "--daemon", "--interval-hours", "6"]
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/interim/hydropulse.db}
      - OPENMETEO_TIMEOUT_SECONDS=${OPENMETEO_TIMEOUT_SECONDS:-20}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
