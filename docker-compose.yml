version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hydropulse_web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PORT=5000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///data/interim/hydropulse.db
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
